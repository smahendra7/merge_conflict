name: AI PR Automation

on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # Checkout the target repository
      - name: Checkout target repository
        uses: actions/checkout@v4

      # Checkout the Automation Repository
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          repository: smahendra7/boAt_GithubAction
          ref: main
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run AI PR Automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python automation/run_action.py
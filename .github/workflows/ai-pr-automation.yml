name: AI PR Automation

on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AI PR Automation
        uses: smahendra7/boAt_GithubAction/.github/actions/ai-pr-automation@main
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload AI Review Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-PR-Review-Report
          path: reports/files/*.docx
          if-no-files-found: ignore
